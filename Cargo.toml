[workspace]
members = [
  "apps/hanako-bridge",
  "apps/hanako-device-router",
  "apps/hanako-installer",
  "apps/hanako-manager",
  "apps/hanako-updater",
  "crates/hanako-bridge-core",
]
resolver = "2"

[workspace.package]
version = "2.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
futures-util = "0.3"
globset = "0.4"
hostname = "0.4"
http = "1"
mslnk = "0.1.8"
pkcs8 = { version = "0.10", features = ["pem"] }
quick-xml = "0.41"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rsa = { version = "0.9.10", features = ["sha2"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tray-icon = "0.24"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
winreg = "0.55"
winit = "0.30"
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }
wry = "0.55"
zip = { version = "8.1", default-features = false, features = ["deflate"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
