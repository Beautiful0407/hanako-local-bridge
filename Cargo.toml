[workspace]
members = [
  "apps/hanako-bridge",
  "apps/hanako-manager",
  "crates/hanako-bridge-core",
]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
futures-util = "0.3"
globset = "0.4"
hostname = "0.4"
http = "1"
pkcs8 = { version = "0.10", features = ["pem"] }
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tray-icon = "0.24"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
winit = "0.30"
wry = "0.55"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
